name: LineageM Transfer Monitor

on:
  schedule:
    # GitHub Actions 最短支援每 5 分鐘執行一次 (建議設為 */10 或 */15)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 允許你在 GitHub 網頁上手動點擊按鈕立即測試執行

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 取得專案程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. 安裝依賴套件
        run: npm install

      - name: 4. 更新 Discord 移民戰情看板
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MESSAGE_ID: ${{ secrets.DISCORD_MESSAGE_ID }}
        run: node scripts/check_transfers.js
