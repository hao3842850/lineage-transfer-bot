name: LineageM Transfer Monitor

on:
  schedule:
    # 每 10 分鐘自動執行一次 (GitHub Actions 最短間隔為 5 分鐘)
    - cron: '*/5 * * * *'
  workflow_dispatch: # 允許手動點擊測試

permissions:
  contents: write # 必須開啟寫入權限，才能儲存已通知紀錄

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 取得專案程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. 安裝依賴套件
        run: npm install

      - name: 4. 更新狀態看板並發送單筆警報
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MESSAGE_ID: ${{ secrets.DISCORD_MESSAGE_ID }}
        run: node scripts/check_transfers.js

      - name: 5. 儲存已通知紀錄回 GitHub (避免單筆警報重複推播)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/notified_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update notified transfer history" && git push)
